name: Build and tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -mod=readonly -short ./...

  build:
    name: Build supported targets
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Build Windows binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -o build/windows-amd64/jvms.exe
          GOOS=windows GOARCH=386   go build -mod=readonly -trimpath -o build/windows-386/jvms.exe

      - name: Build Linux binaries
        run: |
          GOOS=linux GOARCH=amd64       go build -mod=readonly -trimpath -o build/linux-amd64/jvms
          GOOS=linux GOARCH=386         go build -mod=readonly -trimpath -o build/linux-386/jvms
          GOOS=linux GOARCH=arm GOARM=6 go build -mod=readonly -trimpath -o build/linux-armv6/jvms
          GOOS=linux GOARCH=arm64       go build -mod=readonly -trimpath -o build/linux-arm64/jvms

      - name: Build macOS binaries
        run: |
          GOOS=darwin GOARCH=amd64 go build -mod=readonly -trimpath -o build/darwin-amd64/jvms
          GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -o build/darwin-arm64/jvms
